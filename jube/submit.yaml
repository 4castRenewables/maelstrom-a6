name:    dcv2
outpath: dcv2-runs
comment: MAELSTROM AP6 jube script

parameterset:
  - name: trainingParameters
    parameter:
      - name: k
        type: int
        mode: python
        _: '",".join(str(i) for i in range(2, 42, 2))'
      - name: k
        tag: test
        type: int
        _: 2
      - name: epochs
        type: int
        _: 800
      - name: epochs
        tag: test
        type: int
        _: 1
      - name: data_file
        _: 1964-2023-12UTC-300-500-700-850-950-hPa-z-r-t-u-v-deseasonalized.nc
  - name: globalParameters
    parameter:
      - name: systemname
        tag: jwc
        _: juwels-cluster
      - name: systemname
        tag: jwb
        _: juwels-booster
  - name: executeset
    init_with: platform.xml
  - name: systemParameter
    init_with: platform.xml
    parameter:
      - name: job_name
        _: k-$k-$jube_benchmark_name
      - name: account
        _: hclimrep
      - name: nodes
        _: 1
      # The App requires ~150GB per task, and jwc only provides 192G, jwb 512GB.
      # Hence, we can only use 1 and 3 GPUs per node, respectively.
      # NOTE: If cached files are used, all 4 GPUs can be used.
      # A single tensor has ~3MB, so ~22.000 samples use ~66 GB per worker
      - name: gpus
        _: 4
      - name: gpus
        tag: jwc
        _: 1
      - name: gres
        _: gpu:${gpus}
      - name: tasks
        mode: python
        type: int
        _: ${gpus}*${nodes}
      - name: taskspernode
        _: ${gpus}
      - name: threadspertask
        _: 1
      - name: srun_options
        _: --ntasks-per-node=${taskspernode} --cpus-per-task=12
      - name: timelimit
        tag: "!test"
        _: "24:00:00"
      - name: timelimit
        tag: test
        _: "01:00:00"
      - name: queue
        _: booster
      - name: queue
        tag: test
        _: develbooster
      - name: queue
        tag: jwc+!test
        _: gpus
      - name: queue
        tag: jwc+test
        _: develgpus
      - name: tmp_data_dir
        _: 
      - name: master_port
        _: "29500"
      - name: master_addr
        _: "127.0.0.1"
      - name: tmp_data_dir
        _: /p/scratch/$account/$USER/dcv2-runs/k-$k
      - name: env_vars
        # Notes:
        #
        # - srun doesn't inherit cpus-per-task from sbatch,
        #   hence set `SRUN_CPUS_PER_TASK`.
        #
        # - We need to override `CUDA_VISIBLE_DEVICES` due to some weird issue
        #   where srun sets it to `0,1` even if 4 GPUs are allocated.
        _: |
          export NCCL_DEBUG=INFO
          export TORCH_NCCL_ASYNC_ERROR_HANDLING=1
          export MASTER_ADDR="127.0.0.1"
          export MASTER_PORT="29500"
          export SRUN_CPUS_PER_TASK=$${SLURM_CPUS_PER_TASK}
          export APPTAINERENV_CUDA_VISIBLE_DEVICES="$${CUDA_VISIBLE_DEVICES}"
      - name: preprocess
        # Set separator to | to avoid parameterset
        separator: |
        _: |
          ${env_vars}
          mkdir -p ${tmp_data_dir}
      - name: executable
        _: apptainer
      - name: args_exec
        # Set separator to | to avoid parameterset
        separator: |
        _: >
           run
           -B /p/home/jusers/$USER/juwels/code/a6:/opt/a6
           --nv
           /p/project/hclimrep/$USER/a6-cuda.sif
           python /opt/a6/mlflow/train_dcv2.py
           --no-enable-tracking
           --no-plot-results
           --no-parallel-loading
           --data-path /p/project/${account}/$USER/data/ecmwf_era5
           --pattern ${data_file}
           --dump-path ${tmp_data_dir}
           --nmb-crops 2 6
           --crops-for-assign 0 1
           --size-crops 1.0 0.4
           --min-scale-crops 0.5 0.14
           --max-scale-crops 1.0 0.5
           --nmb-prototypes 3
           --nmb-clusters ${k}
           --epochs ${epochs}

step:
  - name: submit
    use:
      - trainingParameters
      - globalParameters
      - systemParameter
      - executeset
      - from: platform.xml
        _: jobfiles
      - from: platform.xml
        _: executesub
    do:
      done_file: $ready_file
      error_file: $error_file
      _: $submit $srun_options $submit_script
